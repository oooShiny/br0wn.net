<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheel of MAHA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Pricedown';
    src: url('fonts/pricedown.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --gold: #e8ab30;
    --brass-light: #f6d888;
    --brass-dark: #7a4a15;
    --rust: #c4501f;
    --orange: #e1671f;
    --mustard: #e0a02c;
    --avocado: #6f7f2e;
    --avocado-dark: #4d5b1f;
    --brown: #4a2c17;
    --brown-dark: #2c1a0d;
    --cream: #f7ead0;
    --red: #c0392b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background:
      repeating-conic-gradient(from 0deg at 50% 8%,
        rgba(255,255,255,0.05) 0deg 6deg,
        rgba(0,0,0,0.05) 6deg 12deg),
      radial-gradient(circle at 50% 8%, var(--mustard) 0%, var(--orange) 35%, var(--brown) 72%, var(--brown-dark) 100%);
    background-attachment: fixed;
    color: var(--cream);
    font-family: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    overflow-x: hidden;
  }

  .stage {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 8px;
  }

  .marquee {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 0 auto 6px;
    max-width: 360px;
  }

  .marquee span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--brass-light);
    box-shadow: 0 0 6px 2px rgba(246, 216, 136, 0.8);
    animation: twinkle 1.6s ease-in-out infinite;
  }

  .marquee span:nth-child(odd) { animation-delay: 0.4s; }
  .marquee span:nth-child(3n) { animation-delay: 0.8s; }

  @keyframes twinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .marquee-strip {
    position: relative;
    left: 50%;
    width: 100vw;
    transform: translateX(-50%);
    height: 16px;
    margin: 16px 0;
    pointer-events: none;
  }

  .marquee-strip::before,
  .marquee-strip::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, var(--brass-light) 3px, transparent 3.5px);
    background-size: 34px 16px;
    background-position: 17px center;
    background-repeat: repeat-x;
    filter: drop-shadow(0 0 4px rgba(246, 216, 136, 0.85));
    animation: bulb-chase 1s steps(2, end) infinite;
  }

  .marquee-strip::after {
    background-position: 34px center;
    animation-delay: 0.5s;
  }

  @keyframes bulb-chase {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.22; }
  }

  h1 {
    font-family: 'Pricedown', 'Alfa Slab One', 'Baloo 2', sans-serif;
    font-size: clamp(34px, 7.5vw, 64px);
    margin: 0;
    text-transform: uppercase;
    color: var(--mustard);
    text-shadow:
      2px 2px 0 var(--brown-dark),
      4px 4px 0 var(--rust),
      0 0 18px rgba(232, 171, 48, 0.45);
  }

  .subtitle {
    margin: 8px 0 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cream);
    opacity: 0.8;
  }

  .board {
    position: relative;
    left: 50%;
    width: 100vw;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 28px;
    min-height: clamp(240px, 60vw, 640px);
  }

  .wheel-frame {
    position: absolute;
    top: 50%;
    width: clamp(240px, 60vw, 640px);
    height: clamp(240px, 60vw, 640px);
  }

  .wheel-frame-left {
    left: 0;
    transform: translate(-50%, -50%);
  }

  .wheel-frame-right {
    right: 0;
    transform: translate(50%, -50%);
  }

  .pointer {
    position: absolute;
    top: 50%;
    width: 0;
    height: 0;
    transform: translateY(-50%);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    z-index: 5;
  }

  .pointer-left {
    right: -4px;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
    border-right: 28px solid var(--red);
  }

  .pointer-right {
    left: -4px;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
    border-left: 28px solid var(--red);
  }

  .wheel-outer {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    padding: 12px;
    background: radial-gradient(circle at 35% 30%, var(--brass-light), var(--gold) 55%, var(--brass-dark) 100%);
    box-shadow: 0 0 0 4px rgba(44,26,13,0.5), 0 10px 30px rgba(44,26,13,0.6);
  }

  .wheel {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    transform: rotate(0deg);
    box-shadow: inset 0 0 0 3px rgba(44,26,13,0.4);
  }

  .wheel-label-item {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 50%;
    height: 2px;
    transform-origin: 0% 50%;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 12px;
    pointer-events: none;
  }

  .wheel-label-item span {
    font-family: 'Baloo 2', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(44,26,13,0.85), 0 0 4px rgba(44,26,13,0.55);
    white-space: nowrap;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16%;
    height: 16%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 30%, var(--brass-light), var(--gold) 60%, var(--brass-dark) 100%);
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(44,26,13,0.55), 0 2px 6px rgba(44,26,13,0.6);
    z-index: 4;
  }

  .center-control {
    position: relative;
    z-index: 7;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0 4px;
  }

  #spinBtn {
    width: clamp(90px, 16vw, 130px);
    height: clamp(90px, 16vw, 130px);
    border-radius: 50%;
    border: 6px solid var(--brass-dark);
    background: radial-gradient(circle at 35% 30%, #ff8a4c, var(--rust) 60%, #7a2b0c 100%);
    color: var(--cream);
    font-family: 'Alfa Slab One', sans-serif;
    font-size: clamp(18px, 3vw, 24px);
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 8px 0 var(--brown-dark), 0 14px 24px rgba(44,26,13,0.55);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  #spinBtn:active:not(:disabled) {
    transform: translateY(6px);
    box-shadow: 0 2px 0 var(--brown-dark), 0 6px 12px rgba(44,26,13,0.55);
  }

  #spinBtn:disabled {
    opacity: 0.55;
    cursor: default;
  }

  #spinBtn:not(:disabled):hover {
    filter: brightness(1.08);
  }

  .status-line {
    margin-top: 14px;
    min-height: 20px;
    font-size: 14px;
    font-weight: 600;
    color: var(--cream);
    opacity: 0.85;
    letter-spacing: 1px;
    text-align: center;
  }

  .broadcast {
    position: absolute;
    left: 50%;
    bottom: 100%;
    margin-bottom: 22px;
    width: min(92vw, 720px);
    text-align: center;
    padding: 22px 28px;
    border-radius: 10px;
    background: linear-gradient(160deg, var(--brown) 0%, var(--brown-dark) 100%);
    border: 4px solid var(--brass-light);
    box-shadow: 0 0 0 4px var(--brass-dark), 0 16px 40px rgba(0,0,0,0.55);
    opacity: 0;
    transform: translateX(-50%) translateY(14px) scale(0.97);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }

  .broadcast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
    pointer-events: auto;
  }

  .broadcast .tag {
    display: inline-block;
    font-family: 'Alfa Slab One', sans-serif;
    background: var(--red);
    color: var(--cream);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 12px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }

  .broadcast p {
    font-size: clamp(18px, 3.4vw, 26px);
    line-height: 1.4;
    margin: 0;
    font-weight: 700;
    color: var(--cream);
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }

  .broadcast .highlight {
    color: var(--mustard);
    font-family: 'Alfa Slab One', sans-serif;
    font-weight: normal;
  }

  .footnote {
    margin-top: 26px;
    font-size: 11px;
    color: var(--cream);
    opacity: 0.55;
    text-align: center;
    max-width: 480px;
    line-height: 1.5;
  }

  .confetti {
    position: fixed;
    top: -20px;
    width: 8px;
    height: 14px;
    z-index: 50;
    pointer-events: none;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(105vh) rotate(540deg);
      opacity: 0.9;
    }
  }

</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="marquee" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <h1>🎡 Wheel of MAHA</h1>
    <p class="subtitle">America's Weekly Food Safety Lottery</p>
  </header>

  <div class="marquee-strip" aria-hidden="true"></div>

  <div class="board">
    <div class="wheel-frame wheel-frame-left">
      <div class="pointer pointer-left"></div>
      <div class="wheel-outer">
        <div class="wheel" id="foodWheel"></div>
        <div class="hub"></div>
      </div>
    </div>

    <div class="center-control">
      <div class="broadcast" id="broadcast">
        <span class="tag">Breaking News</span>
        <p id="broadcastText"></p>
      </div>
      <button id="spinBtn">Spin</button>
    </div>

    <div class="wheel-frame wheel-frame-right">
      <div class="pointer pointer-right"></div>
      <div class="wheel-outer">
        <div class="wheel" id="contamWheel"></div>
        <div class="hub"></div>
      </div>
    </div>
  </div>

  <div class="marquee-strip" aria-hidden="true"></div>

  <div class="status-line" id="statusLine">Press SPIN to find out what's wrong with dinner.</div>

  <p class="footnote">A parody game generating random, fictional pairings for laughs. No real food, brand, or contamination event is being reported.</p>
</div>

<script>
(function () {
  const FOODS = [
    "Chicken", "Ground Beef", "Lettuce", "Spinach", "Cantaloupe",
    "Peanut Butter", "Ice Cream", "Deli Meat", "Eggs", "Onions",
    "Flour", "Cookie Dough", "Bagged Salad", "Oysters", "Frozen Waffles"
  ];

  const CONTAMINANTS = [
    "Salmonella", "E. coli", "Listeria", "Norovirus", "Lead",
    "Mercury", "Mold", "Rat Hair", "Plastic Shards", "Metal Fragments",
    "Mystery Fluid", "Broken Glass", "Botulism", "Sawdust", "Glitter"
  ];

  const COLORS_A = ["#c4501f", "#e0a02c"];
  const COLORS_B = ["#6f7f2e", "#4d5b1f"];

  function buildWheel(el, items, colorPair, pointerAngle) {
    const n = items.length;
    const seg = 360 / n;
    const stops = [];
    for (let i = 0; i < n; i++) {
      const color = colorPair[i % 2];
      stops.push(`${color} ${i * seg}deg ${(i + 1) * seg}deg`);
    }
    el.style.background = `conic-gradient(${stops.join(",")})`;

    // A label's on-screen text angle is (its own mid-angle) + (the
    // wheel's current spin rotation) + (this constant). Choosing the
    // constant as (360 - pointerAngle) guarantees that whichever
    // segment is currently sitting at the pointer reads upright,
    // no matter how far the wheel has spun. Other segments elsewhere
    // on the wheel will still show at varying angles as it turns —
    // that's expected, same as a real prize wheel.
    const textOffset = (360 - pointerAngle) % 360;

    items.forEach((label, i) => {
      const mid = i * seg + seg / 2;
      const item = document.createElement("div");
      item.className = "wheel-label-item";
      item.style.transform = `rotate(${mid}deg)`;
      const span = document.createElement("span");
      span.textContent = label;
      span.style.display = "inline-block";
      span.style.transform = `rotate(${textOffset}deg)`;
      item.appendChild(span);
      el.appendChild(item);
    });

    return { seg, n };
  }

  const foodWheelEl = document.getElementById("foodWheel");
  const contamWheelEl = document.getElementById("contamWheel");
  const foodMeta = buildWheel(foodWheelEl, FOODS, COLORS_A, 0);
  const contamMeta = buildWheel(contamWheelEl, CONTAMINANTS, COLORS_B, 180);

  let foodRotation = 0;
  let contamRotation = 0;

  function pickTarget(meta, currentRotation, extraSpins, pointerAngle) {
    const index = Math.floor(Math.random() * meta.n);
    const midAngle = index * meta.seg + meta.seg / 2;
    // land so that segment's midpoint sits under the side pointer,
    // with a little jitter so it doesn't always land dead-center.
    const jitterRange = Math.max(meta.seg * 0.3, 0);
    const jitter = (Math.random() - 0.5) * jitterRange;
    const baseTarget = (pointerAngle - midAngle + jitter + 360) % 360;
    const currentMod = ((currentRotation % 360) + 360) % 360;
    let delta = baseTarget - currentMod;
    if (delta < 0) delta += 360;
    const finalRotation = currentRotation + delta + extraSpins * 360;
    return { index, finalRotation };
  }

  const spinBtn = document.getElementById("spinBtn");
  const statusLine = document.getElementById("statusLine");
  const broadcast = document.getElementById("broadcast");
  const broadcastText = document.getElementById("broadcastText");

  const FOOD_DURATION = 3.4;
  const CONTAM_DURATION = 5.4;

  function spin() {
    spinBtn.disabled = true;
    broadcast.classList.remove("show");
    statusLine.textContent = "Spinning...";

    // Pointers sit on the inward edge of each wheel: the food wheel's
    // visible half faces right (its pointer sits at the east/0deg rim),
    // the contaminant wheel's visible half faces left (west/180deg rim).
    const foodPick = pickTarget(foodMeta, foodRotation, 6, 0);
    const contamPick = pickTarget(contamMeta, contamRotation, 9, 180);

    foodWheelEl.style.transition = `transform ${FOOD_DURATION}s cubic-bezier(0.15, 0.85, 0.25, 1)`;
    contamWheelEl.style.transition = `transform ${CONTAM_DURATION}s cubic-bezier(0.1, 0.8, 0.2, 1)`;

    // force reflow so the transition applies cleanly
    void foodWheelEl.offsetWidth;
    void contamWheelEl.offsetWidth;

    foodWheelEl.style.transform = `rotate(${foodPick.finalRotation}deg)`;
    contamWheelEl.style.transform = `rotate(${contamPick.finalRotation}deg)`;
    foodRotation = foodPick.finalRotation;
    contamRotation = contamPick.finalRotation;

    setTimeout(() => {
      statusLine.textContent = `${FOODS[foodPick.index]} locked in! Contaminant wheel still spinning...`;
      playTick();
    }, FOOD_DURATION * 1000);

    setTimeout(() => {
      const food = FOODS[foodPick.index];
      const contaminant = CONTAMINANTS[contamPick.index];
      statusLine.textContent = "Press SPIN to find out what's wrong with dinner.";
      broadcastText.innerHTML =
        `Hello America! This week, <span class="highlight">${food}</span> is contaminated with <span class="highlight">${contaminant}</span>!`;
      broadcast.classList.add("show");
      playFanfare();
      launchConfetti();
      spinBtn.disabled = false;
    }, CONTAM_DURATION * 1000);
  }

  spinBtn.addEventListener("click", spin);

  // ---- Sound (Web Audio, no external files) ----
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playTone(freq, start, duration, type, gainPeak) {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime + start);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.15, ctx.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + duration + 0.05);
  }

  function playTick() {
    playTone(880, 0, 0.12, "square", 0.08);
  }

  function playFanfare() {
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    const timings = [0, 0.12, 0.24, 0.36, 0.52, 0.66];
    notes.forEach((freq, i) => {
      playTone(freq, timings[i], 0.35, "triangle", 0.18);
    });
  }

  // ---- Confetti ----
  function launchConfetti() {
    const colors = ["#e8ab30", "#c4501f", "#6f7f2e", "#f7ead0"];
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = 2 + Math.random() * 1.8 + "s";
      piece.style.animationDelay = Math.random() * 0.4 + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 4500);
    }
  }
})();
</script>
</body>
</html>
